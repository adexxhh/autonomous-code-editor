version: '3.8'

services:
  # 1. Redis Service with Health Check
  redis:
    image: redis:7-alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # 2. FastAPI Web Gateway Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: fastapi_web_gateway
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 3. LangGraph ARQ Worker Service
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: langgraph_arq_worker
    command: arq worker.WorkerSettings
    env_file:
      - .env.example
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
